{% extends "web_ui/base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="glass glass-card rounded-[32px] p-8">
        <div class="text-center mb-6">
            <div class="h-12 w-12 bg-tealy/20 rounded-full flex items-center justify-center text-tealy mx-auto mb-3 shadow-sm border border-tealy/30">
                <i class="fa-solid fa-door-open text-xl"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-gray-900 dark:text-white tracking-tight">Join a Group</h2>
            <p class="text-gray-500 text-sm mt-1 dark:text-gray-400">Enter the 6-digit code shared by your friend.</p>
        </div>
        
        {% if error %}
        <div class="bg-red-500/10 border-l-4 border-red-500 text-red-600 p-4 mb-6 text-sm rounded-r flex items-center">
            <i class="fa-solid fa-circle-exclamation mr-2"></i>
            <p class="font-medium">{{ error }}</p>
        </div>
        {% endif %}

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2 dark:text-gray-300">Join Code</label>
                <input name="code" placeholder="Enter code" required
                    class="w-full px-4 py-3 bg-white/40 dark:bg-black/20 border border-white/50 dark:border-white/10 rounded-xl text-gray-900 dark:text-white focus:bg-white/60 dark:focus:bg-black/40 focus:ring-2 focus:ring-tealy focus:border-tealy outline-none transition font-mono uppercase text-center text-lg tracking-widest backdrop-blur-sm">
            </div>
            <div class="grid grid-cols-2 gap-3 pt-2">
                <a href="/" class="py-3 px-4 rounded-xl border border-white/40 dark:border-white/20 text-gray-700 dark:text-gray-300 font-bold text-center hover:bg-white/40 dark:hover:bg-black/20 transition backdrop-blur-sm cursor-pointer">Cancel</a>
                <button type="submit" class="bg-tealy/90 backdrop-blur-md border border-white/30 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-tealy hover:-translate-y-0.5 hover:shadow-tealy/30 transition cursor-pointer">
                    Join
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
