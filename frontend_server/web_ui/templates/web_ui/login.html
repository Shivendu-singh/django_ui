{% extends "web_ui/base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="w-full max-w-md glass glass-card rounded-[32px] overflow-hidden">
        <div class="p-8 sm:p-10">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">Welcome Back</h2>
                <p class="text-gray-500 mt-2 dark:text-gray-400">Sign in to access your groups.</p>
            </div>

            {% if error %}
            <div class="bg-red-500/10 border-l-4 border-red-500 text-red-600 p-4 mb-6 rounded-r-md flex items-center" role="alert">
                <i class="fa-solid fa-circle-exclamation mr-3"></i>
                <p class="text-sm font-medium">{{ error }}</p>
            </div>
            {% endif %}

            <form method="POST" class="space-y-6">
                {% csrf_token %}
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2 dark:text-gray-300">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                        <input name="email" type="email" required placeholder="you@example.com"
                            class="w-full pl-10 pr-4 py-3 bg-white/40 dark:bg-black/20 border border-white/50 dark:border-white/10 rounded-xl focus:bg-white/60 dark:focus:bg-black/40 focus:ring-2 focus:ring-electric focus:border-electric outline-none transition backdrop-blur-sm dark:text-white">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2 dark:text-gray-300">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" name="password" required placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-3 bg-white/40 dark:bg-black/20 border border-white/50 dark:border-white/10 rounded-xl focus:bg-white/60 dark:focus:bg-black/40 focus:ring-2 focus:ring-electric focus:border-electric outline-none transition backdrop-blur-sm dark:text-white">
                    </div>
                </div>

                <button type="submit" class="w-full btn-primary text-white font-bold py-3.5 px-4 rounded-xl shadow-lg mt-4 cursor-pointer">
                    Sign In
                </button>
            </form>
            
            <p class="mt-8 text-center text-sm text-gray-600 dark:text-gray-400">
                Don't have an account? <a href="/signup/" class="text-electric hover:text-blue-700 font-bold transition">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
