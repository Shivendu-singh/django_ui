{% extends "web_ui/base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="w-full max-w-lg glass glass-card rounded-[32px] overflow-hidden">
        <div class="p-8 sm:p-10">
            <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white text-center mb-2 tracking-tight">Create Account</h2>
            <p class="text-center text-gray-500 dark:text-gray-400 mb-8">Start managing your expenses today.</p>

            {% if error %}
            <div class="bg-red-500/10 border-l-4 border-red-500 text-red-600 p-4 mb-6 rounded-r-md flex items-center" role="alert">
                <i class="fa-solid fa-circle-exclamation mr-3"></i>
                <p class="text-sm font-medium">{{ error }}</p>
            </div>
            {% endif %}

            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Username</label>
                    <input name="username" placeholder="jdoe" required class="w-full px-4 py-3 bg-white/40 dark:bg-black/20 border border-white/50 dark:border-white/10 rounded-xl text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:bg-white/60 dark:focus:bg-black/40 focus:ring-2 focus:ring-electric focus:border-electric outline-none transition backdrop-blur-sm">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Email</label>
                    <input name="email" type="email" placeholder="you@example.com" required class="w-full px-4 py-3 bg-white/40 dark:bg-black/20 border border-white/50 dark:border-white/10 rounded-xl text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:bg-white/60 dark:focus:bg-black/40 focus:ring-2 focus:ring-electric focus:border-electric outline-none transition backdrop-blur-sm">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Password</label>
                        <input type="password" name="password" placeholder="••••••••" required class="w-full px-4 py-3 bg-white/40 dark:bg-black/20 border border-white/50 dark:border-white/10 rounded-xl text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:bg-white/60 dark:focus:bg-black/40 focus:ring-2 focus:ring-electric focus:border-electric outline-none transition backdrop-blur-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5">Confirm</label>
                        <input type="password" name="ConfirmPassword" placeholder="••••••••" required class="w-full px-4 py-3 bg-white/40 dark:bg-black/20 border border-white/50 dark:border-white/10 rounded-xl text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:bg-white/60 dark:focus:bg-black/40 focus:ring-2 focus:ring-electric focus:border-electric outline-none transition backdrop-blur-sm">
                    </div>
                </div>

                <button type="submit" class="w-full mt-4 btn-primary text-white font-bold py-3.5 px-4 rounded-xl shadow-lg cursor-pointer">
                    Create Account
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-gray-600 dark:text-gray-400">
                Already have an account? <a href="/login/" class="text-electric dark:text-electric hover:text-blue-700 font-bold transition">Log in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
